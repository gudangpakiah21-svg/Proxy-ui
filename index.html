<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VPN Dashboard + Bug & IP Checker</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f4f6f9; color: #333; padding-bottom: 50px; }
    header { display: flex; justify-content: space-between; align-items: center; padding: 15px 25px; background: #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.08); }
    .logo { font-size: 20px; font-weight: 800; color: #0288d1; text-decoration: none; }
    .logo span { color: #333; }
    .container { max-width: 750px; margin: 20px auto; padding: 0 15px; }
    
    .card { background: #fff; padding: 20px; border-radius: 10px; box-shadow: 0 3px 10px rgba(0,0,0,0.05); margin-bottom: 20px; border: 1px solid #e0e0e0; }
    .card h3 { font-size: 15px; color: #0288d1; margin-bottom: 15px; border-bottom: 2px solid #0288d1; display: inline-block; padding-bottom: 4px; }
    
    label { font-size: 11px; font-weight: bold; color: #555; display: block; margin-top: 10px; text-transform: uppercase; }
    input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; margin-top: 5px; font-size: 13px; background: #fff; }
    
    .btn { width: 100%; padding: 10px; background: #0288d1; color: #fff; border: none; font-weight: bold; border-radius: 6px; cursor: pointer; margin-top: 12px; font-size: 13px; }
    .btn:hover { background: #0277bd; }
    .btn-green { background: #00c853; }
    .btn-green:hover { background: #00b0ff; }
    
    /* Status Badge */
    .status-card { display: flex; justify-content: space-between; align-items: center; background: #e3f2fd; padding: 12px 15px; border-radius: 8px; border: 1px solid #bbdefb; margin-bottom: 15px; }
    .ping-tag { font-size: 11px; padding: 4px 8px; border-radius: 4px; font-weight: bold; color: #fff; }
    .online { background: #00c853; }
    .offline { background: #ff5252; }
    .checking { background: #ffab00; color: #000; }

    /* Tables */
    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 12px; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #eee; }
    th { background: #f8f9fa; color: #555; font-size: 11px; text-transform: uppercase; }
    .badge { padding: 3px 6px; border-radius: 4px; font-size: 10px; font-weight: bold; color: #fff; }
    .badge-vless { background: #00c853; }
    .badge-vmess { background: #ff9100; }
    .badge-trojan { background: #d500f9; }

    .config-box { background: #1e1e1e; color: #00e676; padding: 10px; border-radius: 6px; font-size: 11px; word-break: break-all; margin-top: 8px; display: none; font-family: monospace; }
    .result-box { margin-top: 10px; padding: 10px; border-radius: 6px; background: #f8f9fa; font-size: 12px; font-family: monospace; border: 1px solid #ccc; display: none; }
  </style>
</head>
<body>

  <header>
    <a href="#" class="logo">VPN <span>Tools & Manager</span></a>
    <button onclick="checkServerHealth()" style="padding:5px 10px; background:#0288d1; color:#fff; border:none; border-radius:4px; font-size:11px; font-weight:bold; cursor:pointer;">Ping Server</button>
  </header>

  <div class="container">
    
    <!-- 1. SERVER HEALTH STATUS -->
    <div class="status-card">
      <div><b>Server Node Host:</b> <span id="serverHost">--</span></div>
      <div id="serverStatusBadge" class="ping-tag checking">CHECKING...</div>
    </div>

    <!-- 2. BUG SNI / HOST CHECKER -->
    <div class="card">
      <h3>1. Bug Host / SNI Checker</h3>
      <label>Domain Bug / Host SNI</label>
      <input type="text" id="bugInput" placeholder="Contoh: m.facebook.com">
      <button class="btn" onclick="checkBugHost()">TEST BUG HOST</button>
      <div id="bugResult" class="result-box"></div>
    </div>

    <!-- 3. CLEAN IP CLOUDFLARE CHECKER -->
    <div class="card">
      <h3>2. Clean IP Proxy Checker</h3>
      <label>Masukkan IP Proxy Cloudflare</label>
      <input type="text" id="ipInput" value="104.17.3.81">
      <button class="btn btn-green" onclick="checkCleanIP()">TEST CLEAN IP</button>
      <div id="ipResult" class="result-box"></div>
    </div>

    <!-- 4. VPN ACCOUNT GENERATOR -->
    <div class="card">
      <h3>3. Buat Akun VPN (Auto-Active)</h3>
      
      <label>Lokasi Node Server</label>
      <select id="serverCountry">
        <option value="🇸🇬 SG">🇸🇬 Singapore 1 (Fast Node)</option>
        <option value="🇮🇩 ID">🇮🇩 Indonesia 1 (ID Direct)</option>
        <option value="🇹🇭 TH">🇹🇭 Thailand 1 (Bangkok)</option>
        <option value="🇯🇵 JP">🇯🇵 Japan 1 (Tokyo)</option>
      </select>

      <label>Protokol VPN</label>
      <select id="vpnProtocol">
        <option value="vless">VLESS WebSocket</option>
        <option value="vmess">VMess WebSocket</option>
        <option value="trojan">Trojan WS TLS</option>
      </select>

      <label>Username / Remark Akun</label>
      <input type="text" id="usernameInput" placeholder="Nama Akun...">

      <button class="btn" onclick="addAccount()">GENERATE AKUN SIAP PAKAI</button>
    </div>

    <!-- 5. LIST AKUN -->
    <div class="card">
      <h3>Daftar Akun VPN Aktif</h3>
      <table>
        <thead>
          <tr>
            <th>Negara / Remark</th>
            <th>Protokol</th>
            <th>Aksi</th>
          </tr>
        </thead>
        <tbody id="accountTableBody"></tbody>
      </table>
    </div>

  </div>

  <script>
    const BACKEND_UUID = "d3b07384-d113-424a-a513-33e9d0b61e2f";
    const currentDomain = window.location.host;
    document.getElementById('serverHost').innerText = currentDomain;

    let accounts = [
      { id: '1', country: '🇸🇬 SG', user: 'Default-User', protocol: 'vless' }
    ];

    // Cek Server Status Online
    async function checkServerHealth() {
      const badge = document.getElementById('serverStatusBadge');
      badge.className = "ping-tag checking";
      badge.innerText = "CHECKING...";

      const start = Date.now();
      try {
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 4000);
        await fetch(`https://${currentDomain}/`, { mode: 'no-cors', signal: controller.signal });
        clearTimeout(timeout);
        
        const duration = Date.now() - start;
        badge.className = "ping-tag online";
        badge.innerText = `ONLINE (${duration} ms)`;
      } catch (e) {
        badge.className = "ping-tag offline";
        badge.innerText = "OFFLINE / TIMEOUT";
      }
    }

    // Bug Host / SNI Checker
    async function checkBugHost() {
      const bug = document.getElementById('bugInput').value.trim();
      const resultBox = document.getElementById('bugResult');
      if (!bug) return alert('Masukkan domain bug!');

      resultBox.style.display = 'block';
      resultBox.innerText = 'Memeriksa respon bug...';

      const start = Date.now();
      try {
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 4000);
        const url = bug.startsWith('http') ? bug : `https://${bug}`;
        
        await fetch(url, { mode: 'no-cors', signal: controller.signal });
        clearTimeout(timeout);
        
        const duration = Date.now() - start;
        resultBox.style.color = '#00c853';
        resultBox.innerText = `[SUCCESS] Bug Host Active! Delay: ${duration} ms`;
      } catch (err) {
        resultBox.style.color = '#ff5252';
        resultBox.innerText = `[FAILED] Bug Host Error / Timeout!`;
      }
    }

    // Clean IP Proxy Checker
    async function checkCleanIP() {
      const ip = document.getElementById('ipInput').value.trim();
      const resultBox = document.getElementById('ipResult');
      if (!ip) return alert('Masukkan IP Proxy!');

      resultBox.style.display = 'block';
      resultBox.innerText = 'Memeriksa status Clean IP...';

      const start = Date.now();
      try {
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 4000);
        await fetch(`https://${ip}:443`, { mode: 'no-cors', signal: controller.signal });
        clearTimeout(timeout);
        
        const duration = Date.now() - start;
        resultBox.style.color = '#00c853';
        resultBox.innerText = `[ACTIVE] Clean IP ${ip}:443 Merespon (${duration} ms)`;
      } catch (err) {
        resultBox.style.color = '#ffab00';
        resultBox.innerText = `[STATUS UNCERTAIN] Terhubung via TLS Proxy.`;
      }
    }

    // Render Akun VPN
    function renderAccounts() {
      const tbody = document.getElementById('accountTableBody');
      tbody.innerHTML = '';

      accounts.forEach(acc => {
        let link = '';
        if (acc.protocol === 'vless') {
          link = `vless://${BACKEND_UUID}@${currentDomain}:443?path=%2Fvless&security=tls&encryption=none&type=ws#${acc.user}`;
        } else if (acc.protocol === 'trojan') {
          link = `trojan://${BACKEND_UUID}@${currentDomain}:443?path=%2Ftrojan&security=tls&type=ws#${acc.user}`;
        } else {
          const vmessObj = { v: "2", ps: acc.user, add: currentDomain, port: "443", id: BACKEND_UUID, aid: "0", scy: "auto", net: "ws", type: "none", host: currentDomain, path: "/vmess", tls: "tls" };
          link = "vmess://" + btoa(JSON.stringify(vmessObj));
        }

        const badgeClass = acc.protocol === 'vless' ? 'badge-vless' : (acc.protocol === 'vmess' ? 'badge-vmess' : 'badge-trojan');

        tbody.innerHTML += `
          <tr>
            <td>
              <b>${acc.country}</b> - ${acc.user}<br>
              <small style="color:#00c853;">Status: Konek 100%</small>
            </td>
            <td><span class="badge ${badgeClass}">${acc.protocol.toUpperCase()}</span></td>
            <td>
              <button onclick="toggleLink('${acc.id}')" style="padding:4px 8px; font-size:11px; background:#0288d1; color:#fff; border:none; border-radius:4px; cursor:pointer;">Show</button>
              <button onclick="deleteAccount('${acc.id}')" style="padding:4px 8px; font-size:11px; background:#ff5252; color:#fff; border:none; border-radius:4px; cursor:pointer;">Hapus</button>
            </td>
          </tr>
          <tr>
            <td colspan="3" style="padding:0;">
              <div id="box-${acc.id}" class="config-box">${link}</div>
            </td>
          </tr>
        `;
      });
    }

    function addAccount() {
      const country = document.getElementById('serverCountry').value;
      const protocol = document.getElementById('vpnProtocol').value;
      const user = document.getElementById('usernameInput').value.trim() || 'User-' + Math.floor(Math.random() * 1000);

      accounts.push({
        id: Date.now().toString(),
        country: country,
        user: user,
        protocol: protocol
      });

      document.getElementById('usernameInput').value = '';
      renderAccounts();
    }

    function deleteAccount(id) {
      accounts = accounts.filter(a => a.id !== id);
      renderAccounts();
    }

    function toggleLink(id) {
      const box = document.getElementById('box-' + id);
      box.style.display = box.style.display === 'block' ? 'none' : 'block';
    }

    renderAccounts();
    checkServerHealth();
  </script>

</body>
</html>
